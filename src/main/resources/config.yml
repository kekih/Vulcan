# ============================================
#           Vulcan - Конфигурация
# ============================================
# Плагин для Paper 1.16.5
# Все сообщения на русском языке

settings:
  # Язык (только ru)
  language: ru
  # Интервал автоматического появления в секундах (по умолчанию 4 часа = 14400)
  spawn-interval: 14400
  # Время до извержения после появления в секундах (по умолчанию 6 минут = 360)
  eruption-delay: 360
  # Только один активный вулкан одновременно
  one-active-vulcan: true
  # Восстанавливать таймер после рестарта сервера
  restore-timer-after-restart: true
  # Уведомления перед появлением (в секундах до появления)
  pre-spawn-notifications:
    enabled: true
    times: [300, 60]  # 5 минут и 1 минута
  # Радиус разбрасывания предметов при извержении
  drop-radius: 8
  # Количество предметов за извержение (минимум-максимум)
  drops-min: 8
  drops-max: 18
  # Высота выброса предметов
  drop-height: 2.5
  # Скорость выброса
  drop-velocity: 0.6
  # Длительность эффектов извержения в тиках (20 тиков = 1 сек)
  eruption-effect-duration: 100
  # Максимум частиц за тик (для производительности)
  max-particles-per-tick: 40

# Сообщения (используют цветовые коды &)
messages:
  prefix: "&6&lВУЛКАН &8» &f"
  no-permission: "&cУ вас нет прав для выполнения этой команды."
  player-only: "&cЭта команда доступна только игрокам."
  unknown-subcommand: "&cНеизвестная подкоманда. Используйте /vulcan help"
  reload: "&aКонфигурация успешно перезагружена."
  no-active: "&7Сейчас нет активного вулкана."
  timer: "&7Следующий вулкан появится через &e{time}"
  timer-type: "&7Следующий вулкан: &e{type}&7 появится через &e{time}"
  spawned-normal: "&aОбычный вулкан&f появился на сервере!"
  spawned-legendary: "&d&lЛегендарный вулкан&f появился на сервере!"
  spawned-mythical: "&5&lМифический вулкан&f появился на сервере!"
  eruption-start: "&eВулкан начинает извергаться!"
  eruption-end: "&7Извержение завершено."
  pre-spawn-5min: "&eЧерез 5 минут на сервере появится вулкан!"
  pre-spawn-1min: "&cЧерез 1 минуту на сервере появится вулкан!"
  location-set: "&aЛокация для &e{type}&a сохранена: &f{world} {x}, {y}, {z}"
  interval-set: "&aИнтервал появления установлен на &e{seconds}&a секунд."
  duration-set: "&aВремя до извержения установлено на &e{seconds}&a секунд."
  reward-added: "&aПредмет добавлен в награды &e{type}&a."
  reward-removed: "&aНаграда №{index} удалена из &e{type}&a."
  chance-set: "&aШанс награды №{index} для &e{type}&a установлен на &e{chance}%&a."
  invalid-type: "&cНеверный тип вулкана. Доступны: normal, legendary, mythical"
  no-item-in-hand: "&cВозьмите предмет в руку."
  invalid-number: "&cУкажите корректный номер."
  spawn-manual: "&aВулкан типа &e{type}&a вызван вручную."
  despawn: "&aАктивный вулкан удалён."
  already-active: "&cУже есть активный вулкан. Сначала удалите его."
  not-found: "&cВулкан указанного типа не найден в конфигурации."

# Типы вулканов
# Легендарный — самый ценный, Мифический — самый редкий
vulcans:
  normal:
    display-name: "Обычный вулкан"
    # Шанс появления (вес, сумма всех не обязана быть 100)
    spawn-chance: 75
    world: world
    x: 100.0
    y: 65.0
    z: -200.0
    # Цвет в сообщениях
    color: "&a"
    # Интенсивность эффектов (1.0 = стандарт)
    effect-intensity: 1.0
    rewards: []

  legendary:
    display-name: "Легендарный вулкан"
    spawn-chance: 20
    world: world
    x: 200.0
    y: 65.0
    z: -200.0
    color: "&d"
    effect-intensity: 1.6
    rewards: []

  mythical:
    display-name: "Мифический вулкан"
    spawn-chance: 5
    world: world
    x: 300.0
    y: 65.0
    z: -200.0
    color: "&5"
    effect-intensity: 2.2
    rewards: []

# Пример наград (добавьте через /vulcan add или вручную)
