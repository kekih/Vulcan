name: Vulcan
version: 1.0.0
main: ru.kekih.vulcan.VulcanPlugin
api-version: 1.16
author: kekih
description: Система вулканов с автоматическим появлением и извержением
commands:
  vulcan:
    description: Основная команда плагина Vulcan
    usage: /vulcan <подкоманда>
    aliases: [вулкан]
permissions:
  vulcan.admin:
    description: Полный доступ к административным командам
    default: op
  vulcan.info:
    description: Доступ к команде /vulcan info
    default: true
